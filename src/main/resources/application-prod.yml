spring:
  application:
    name: mainframes-java-app

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    root: INFO
    com.mainframes: INFO
  file:
    name: /logs/application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
