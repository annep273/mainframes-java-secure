name: Build Alternative Dockerfile (UBI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.ubi'

env:
  REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.REGISTRY_NAMESPACE }}/mainframes-java-app
  JAVA_VERSION: '17'

jobs:
  build-ubi-image:
    name: Build with Red Hat UBI base image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/s390x
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push UBI-based image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ubi
          platforms: linux/s390x
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ubi-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ubi-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ubi-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ubi-buildcache,mode=max
